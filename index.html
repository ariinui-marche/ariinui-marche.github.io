<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché — Ariinui</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marché">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Marché</h1>
    <div class="update-info">
      <span id="updateStatus">Chargement…</span>
      <button id="refreshBtn" title="Rafraîchir">⟳</button>
    </div>
  </header>

  <div id="tvTicker" class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
    {
      "symbols": [
        { "proName": "FX:EURUSD", "title": "EUR/USD" },
        { "proName": "FX:GBPUSD", "title": "GBP/USD" },
        { "proName": "FX:USDJPY", "title": "USD/JPY" },
        { "proName": "FX:USDCHF", "title": "USD/CHF" },
        { "proName": "FX:AUDUSD", "title": "AUD/USD" },
        { "proName": "FX:USDCAD", "title": "USD/CAD" },
        { "proName": "FX:NZDUSD", "title": "NZD/USD" },
        { "proName": "OANDA:XAUUSD", "title": "Gold" },
        { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" }
      ],
      "showSymbolLogo": true,
      "isTransparent": true,
      "displayMode": "adaptive",
      "colorTheme": "dark",
      "locale": "fr"
    }
    </script>
  </div>

  <main>
    <section class="panel">
      <h2>Force des Devises</h2>
      <div id="currencyGrid" class="currency-grid"></div>
    </section>

    <section class="panel">
      <h2>Calendrier Économique</h2>
      <div class="filters" id="impactFilters">
        <button class="filter-btn" data-impact="all">Tout</button>
        <button class="filter-btn active" data-impact="High">High</button>
        <button class="filter-btn" data-impact="Medium">Medium</button>
        <button class="filter-btn" data-impact="Low">Low</button>
      </div>
      <div id="ecoList" class="eco-list"></div>
    </section>

    <section class="panel">
      <h2>Calendrier TradingView</h2>
      <div class="tv-embed-box">
        <div class="tradingview-widget-container" style="height:100%;width:100%">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
          {
            "colorTheme": "dark",
            "isTransparent": true,
            "width": "100%",
            "height": "100%",
            "locale": "fr",
            "importanceFilter": "0,1",
            "countryFilter": "us,eu,gb,jp,au,ca,ch,nz,cn"
          }
          </script>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>Force Devise : BabyPips (live) · News Éco : ForexFactory (rafraîchi toutes les 5 min)</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="./script.js"></script>
</body>
</html>
