<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marché — Ariinui</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marché">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Marché</h1>
    <div class="update-info">
      <span id="updateStatus">Chargement…</span>
      <button id="refreshBtn" title="Rafraîchir">⟳</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Force des Devises</h2>
      <div id="currencyGrid" class="currency-grid"></div>
    </section>

    <section class="panel">
      <h2>Calendrier Économique</h2>
      <div class="filters" id="impactFilters">
        <button class="filter-btn" data-impact="all">Tout</button>
        <button class="filter-btn active" data-impact="High">High</button>
        <button class="filter-btn" data-impact="Medium">Medium</button>
        <button class="filter-btn" data-impact="Low">Low</button>
      </div>
      <div id="ecoList" class="eco-list"></div>
    </section>

    <section class="panel">
      <h2>News Marché</h2>
      <div class="filters" id="newsFilters">
        <button class="filter-btn active" data-ccy="all">Tout</button>
        <button class="filter-btn" data-ccy="EUR">EUR</button>
        <button class="filter-btn" data-ccy="USD">USD</button>
        <button class="filter-btn" data-ccy="GBP">GBP</button>
        <button class="filter-btn" data-ccy="JPY">JPY</button>
        <button class="filter-btn" data-ccy="CHF">CHF</button>
        <button class="filter-btn" data-ccy="AUD">AUD</button>
        <button class="filter-btn" data-ccy="CAD">CAD</button>
        <button class="filter-btn" data-ccy="NZD">NZD</button>
        <button class="filter-btn" data-ccy="XAU">Gold</button>
        <button class="filter-btn" data-ccy="BTC">BTC</button>
      </div>
      <div id="newsList" class="eco-list"></div>
    </section>
  </main>

  <footer>
    <span>Force Devise : BabyPips (live) · News Éco : ForexFactory · News Marché : FXStreet, Investing.com, BeInCrypto, Reuters, Google News + banques centrales officielles (BoE, Fed, ECB, BoJ, RBA, BoC) — rafraîchi toutes les 5 min</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <script src="./script.js"></script>
</body>
</html>
