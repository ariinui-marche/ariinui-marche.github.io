<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Next High</title>
<link rel="manifest" href="./widget.webmanifest">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Next High">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
:root { --bg:#05070b; --line:#2a2f3a; --text:#e6e9ef; --dim:#8b93a3; --amber:#f5b642; --red:#ef4444; --green:#22c55e; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: Consolas, "SF Mono", Menlo, "Courier New", monospace;
  display: flex; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
.w { width: 100%; max-width: 420px; border: 1px solid var(--line); border-left: 3px solid var(--red); border-radius: 4px; background: var(--bg); }
.w-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: #0b0f16; }
.w-date { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--amber); }
.w-tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #fff; background: var(--red); padding: 1px 6px; border-radius: 2px; white-space: nowrap; }
.w-body { padding: 22px 14px 20px; text-align: center; }
.w-at { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.w-event { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.w-flag { font-size: 22px; }
.w-ccy { color: var(--amber); font-weight: 700; font-size: 14px; }
.w-title { font-size: 16px; }
.w-count { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 46px; font-weight: 700; letter-spacing: 1px; color: var(--red); font-variant-numeric: tabular-nums; line-height: 1; }
.w-count.cd-green { color: var(--green); } .w-count.cd-orange { color: #f59e0b; } .w-count.cd-red { color: var(--red); }
.w-sub { margin-top: 8px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
.w-empty { padding: 28px 14px; text-align: center; color: var(--dim); font-size: 13px; }
img.emoji { height: 1.15em; width: 1.15em; vertical-align: -0.15em; }
.eco-time-gray { color: #9ca3af; } .eco-time-blue { color: #3b82f6; } .eco-time-red { color: var(--red); } .eco-time-green { color: var(--green); } .eco-time-yellow { color: #eab308; }
@media (max-width: 360px) { .w-at { font-size: 38px; } .w-count { font-size: 38px; } }
</style>
</head>
<body>
<div class="w" id="w"></div>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
const COUNTRY_FLAGS = { USD:'🇺🇸', EUR:'🇪🇺', GBP:'🇬🇧', JPY:'🇯🇵', AUD:'🇦🇺', NZD:'🇳🇿', CAD:'🇨🇦', CHF:'🇨🇭', CNY:'🇨🇳' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

function ecoTimeColorClass(hour) {
  if (hour >= 14 && hour < 17) return 'eco-time-blue';
  if (hour >= 22 || hour < 2) return 'eco-time-red';
  if (hour >= 2 && hour < 3) return 'eco-time-green';
  if (hour >= 3 && hour < 7) return 'eco-time-yellow';
  return 'eco-time-gray';
}

let events = [];
let next = null;

function findNext() {
  const now = Date.now();
  next = events.find((e) => e.impact === 'High' && new Date(e.date).getTime() > now) || null;
}

function renderStatic() {
  const el = document.getElementById('w');
  if (!next) { el.innerHTML = '<div class="w-empty">Aucun événement High à venir</div>'; return; }
  const d = new Date(next.date);
  const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const date = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const same = events.filter((e) => e !== next && e.impact === 'High' && e.date === next.date).length;
  el.innerHTML = `
    <div class="w-head"><span class="w-date">${esc(date)}</span><span class="w-tag">Next High</span></div>
    <div class="w-body">
      <div class="w-at ${ecoTimeColorClass(d.getHours())}">${time}</div>
      <div class="w-event">
        <span class="w-flag">${COUNTRY_FLAGS[next.country] || '🏳️'}</span>
        <span class="w-ccy">${esc(next.country)}</span>
        <span class="w-title">${esc(next.title)}</span>
      </div>
      <div class="w-count" id="cd">--:--:--</div>
      <div class="w-sub">${same ? `+${same} autre${same > 1 ? 's' : ''} High simultané${same > 1 ? 's' : ''}` : 'Compte à rebours'}</div>
    </div>`;
  if (window.twemoji) twemoji.parse(el, { folder: 'svg', ext: '.svg' });
  tick();
}

function tick() {
  if (!next) return;
  const diff = new Date(next.date).getTime() - Date.now();
  if (diff <= 0) { findNext(); renderStatic(); return; }
  const t = Math.floor(diff / 1000);
  const pad = (n) => String(n).padStart(2, '0');
  const cd = document.getElementById('cd');
  if (cd) {
    cd.textContent = `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`;
    cd.className = 'w-count ' + (t > 6 * 3600 ? 'cd-green' : t > 3600 ? 'cd-orange' : 'cd-red');
  }
}

async function load() {
  try {
    const res = await fetch(`./data/eco-calendar.json?t=${Date.now()}`, { cache: 'no-store' });
    const data = await res.json();
    events = (data.events || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  } catch (e) { /* garde les données déjà chargées */ }
  findNext();
  renderStatic();
}

setInterval(tick, 1000);
// Pas de setInterval de fetch : on recharge les données seulement au retour sur l'app.
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</body>
</html>
