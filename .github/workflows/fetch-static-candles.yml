name: Fetch Static Candles (31 paires 1D + 1W)

on:
  schedule:
    - cron: '20 21,22 * * *'   # après la clôture 17h New York (21h ou 22h UTC selon l'heure d'été)
    - cron: '20 3,9,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  candles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock ws
      - run: node scripts/fetch-static-candles.mjs ALL 1D
      - run: node scripts/fetch-static-candles.mjs ALL 1W
      - run: node scripts/build-daily-tv.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candles data/daily-tv.json
          git diff --staged --quiet || git commit -m "Update static candles 1D $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -X theirs origin main
          git push
