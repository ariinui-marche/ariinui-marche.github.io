name: Send Currency Strength Screenshot to Telegram

on:
  schedule:
    # 02:53 UTC-10 (Hawaii, no DST) = 12:53 UTC — 7min before 03h to dodge
    # top-of-hour GitHub Actions congestion (GitHub explicitly recommends
    # off-the-hour minutes for scheduled workflows to reduce delay risk).
    - cron: '53 12 * * *'
    # 14:53 UTC-10 (Hawaii, no DST) = 00:53 UTC — 7min before 15h
    - cron: '53 0 * * *'
    # 22:53 UTC-10 (Hawaii, no DST) = 08:53 UTC (next day) — 7min before 23h
    - cron: '53 8 * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - run: node scripts/screenshot-currency.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
