name: Send Currency Strength Screenshot to Telegram

on:
  schedule:
    # 03:00 UTC-10 (Hawaii, no DST) = 13:00 UTC — :07 to dodge top-of-hour
    # GitHub Actions congestion (GitHub explicitly recommends off-the-hour
    # minutes for scheduled workflows to reduce delay risk).
    - cron: '7 13 * * *'
    # 15:00 UTC-10 (Hawaii, no DST) = 01:00 UTC
    - cron: '7 1 * * *'
    # 22:00 UTC-10 (Hawaii, no DST) = 08:00 UTC (next day)
    - cron: '7 8 * * *'
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - run: node scripts/screenshot-currency.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
