name: TV calendar test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TradingView calendar from GitHub runner
        run: |
          FROM=$(date -u -d '-3 days' +%Y-%m-%dT00:00:00.000Z)
          TO=$(date -u -d '+2 days' +%Y-%m-%dT23:59:59.000Z)
          CODE=$(curl -s -m 30 -o tv.json -w '%{http_code}' \
            -H 'Origin: https://www.tradingview.com' -H 'User-Agent: Mozilla/5.0' \
            "https://economic-calendar.tradingview.com/events?from=$FROM&to=$TO&countries=US,AU,GB,EU,JP,CA,NZ,CH")
          echo "HTTP $CODE"
          head -c 300 tv.json; echo
          node -e "const r=require('./tv.json').result||[];const h=r.filter(e=>e.importance===1);console.log('total',r.length,'high',h.length,'high avec actual',h.filter(e=>e.actual!=null).length)"
