name: Fetch Daily Candles

on:
  schedule:
    # fin de chaque bougie POH (heures UTC+2 : 02,03,05,10,11,14,15,19,24 = 00,01,03,08,09,12,13,17,22 UTC), +10 min
    - cron: '10 0,1,3,8,9,12,13,17,22 * * *'
    # doublons de secours (GitHub saute souvent des exécutions planifiées)
    - cron: '40 0,1,3,8,9,12,13,17,22 * * *'
    - cron: '25 2,5,10,15,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  candles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-candles.mjs
      - run: npm install --no-save --no-package-lock ws
      - run: node scripts/fetch-poh-candles.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-candles.json data/poh-candles.json
          git diff --staged --quiet || git commit -m "Update daily candles $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -X theirs origin main
          git push
